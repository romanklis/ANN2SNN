[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ann2snn-sim-engine"
version = "0.1.0"
description = "Ball-and-plate simulation engine: PID, dense ANN, connectome ANN and lossless SNN controllers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "torch>=2.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = ["pytest>=7.0"]
dashboard = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "gunicorn>=21.0",
]
video = ["matplotlib>=3.6"]

[project.scripts]
sim-engine = "sim_engine.cli:main"

[tool.setuptools]
packages = ["sim_engine", "sim_engine.controllers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
